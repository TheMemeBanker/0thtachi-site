<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0thTachi</title>
<meta name="description" content="AI models get most of the attention. But the model is only one part of an agent.">
<link rel="icon" type="image/png" href="assets/fav-zeroblade-b1.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #07080a;
    color: #e2e8f0;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; padding: 2rem; }
  .mark {
    width: 132px; height: 132px;
    image-rendering: pixelated;
    user-select: none;
  }
  h1 {
    margin-top: 1.6rem;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: .55em;
    text-indent: .55em;
    color: #e2e8f0;
  }
  .riddle {
    font-size: .92rem;
    letter-spacing: .1em;
    color: #94a3b8;
  }
  .cmd {
    margin-top: 2.6rem;
    display: inline-block;
    font-size: .92rem;
    color: #3b82f6;
    cursor: pointer;
    letter-spacing: .06em;
    user-select: none;
  }
  .cmd .ps1 { color: #334155; }
  .cmd .cursor {
    display: inline-block; width: .55em; height: 1.05em;
    background: #3b82f6; vertical-align: text-bottom; margin-left: .18em;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .hint {
    margin-top: .8rem;
    font-size: .68rem;
    letter-spacing: .1em;
    color: #1e293b;
    transition: color .3s;
  }
  .pg-placeholder {
    margin-top: 1.35rem;
    font-size: .68rem;
    letter-spacing: .1em;
    color: #334155;
  }
  .github-link {
    position: fixed;
    right: 1.25rem;
    bottom: 1rem;
    color: #334155;
    text-decoration: none;
    font-size: .68rem;
    letter-spacing: .08em;
    transition: color .25s;
  }
  .github-link:hover { color: #3b82f6; }
  @media (max-width: 480px) {
    .mark { width: 104px; height: 104px; }
    h1 { font-size: .9rem; letter-spacing: .45em; text-indent: .45em; }
    .github-link { right: .9rem; bottom: .8rem; }
  }
</style>
</head>
<body>
<main>
  <p class="riddle">AI models get most of the attention. But the model is only one part of an agent.</p>
  <div class="cmd" id="cmd" title="copy"><span class="ps1">$&nbsp;</span>npx unsheathe<span class="cursor"></span></div>
  <p class="hint" id="hint">share the command. never the door.</p>
  <p class="pg-placeholder">$pg</p>
</main>
<a class="github-link" href="https://github.com/0xPlaygrounds" target="_blank" rel="noopener noreferrer">github</a>
<script>
  var cmd = document.getElementById('cmd'), hint = document.getElementById('hint');
  cmd.addEventListener('click', function () {
    var done = function () {
      var prev = hint.textContent;
      hint.textContent = 'copied.';
      hint.style.color = '#3b82f6';
      setTimeout(function () { hint.textContent = prev; hint.style.color = ''; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText('npx unsheathe').then(done, function () {});
    }
  });
</script>
</body>
</html>
